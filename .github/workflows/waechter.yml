name: Wächter

# Läuft bewusst bei GitHub und nicht bei Vercel: Ein Wächter auf derselben
# Plattform wie das Überwachte schweigt genau dann, wenn es darauf ankommt.
# Vercel Cron in vercel.json ist nur die Rückfallebene (Hobby-Tarif erlaubt
# dort ohnehin nur einen Lauf pro Tag).
#
# WARUM DAS REPO ÖFFENTLICH IST: Für private Repos sind 2000 Actions-Minuten
# im Monat frei, und jeder Lauf wird auf eine volle Minute aufgerundet, obwohl
# er 5 bis 15 Sekunden dauert. Alle fünf Minuten wären 8640 Minuten - das
# Vierfache. Ohne hinterlegte Zahlungsweise hätte GitHub die Actions dann bis
# zum Monatsende abgestellt, und die Statusseite wäre ab dem 7. stumm.
# Für öffentliche Repos sind Actions unbegrenzt frei. Deshalb liegt der Code
# offen; die Schlüssel liegen in GitHub Secrets und bei Vercel und sind davon
# unberührt (am 23.08. gegen die ganze Historie und die Protokolle geprüft).
#
# ACHTUNG BEIM ÄNDERN: Der Takt hier muss zu CHECK_INTERVAL_MINUTES passen -
# daraus rechnet rollup_day die Ausfallminuten. Ein Test vergleicht beide.
# GitHub hält den Takt übrigens nicht genau ein; unter Last kommen Läufe
# später oder fallen aus. Das ist hier verkraftbar, weil aus drei
# Fehlmessungen hintereinander ein Vorfall wird und nicht aus einer Uhrzeit.
on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

jobs:
  messen:
    runs-on: ubuntu-latest
    steps:
      - name: Dienste prüfen
        run: |
          code=$(curl -sS -o /tmp/antwort.json -w '%{http_code}' \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            "${{ secrets.STATUS_URL }}/api/check")
          cat /tmp/antwort.json
          echo
          if [ "$code" != "200" ]; then
            echo "Wächter antwortete mit HTTP $code"
            exit 1
          fi
