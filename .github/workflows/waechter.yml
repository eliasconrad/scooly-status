name: Wächter

# Läuft bewusst bei GitHub und nicht bei Vercel: Ein Wächter auf derselben
# Plattform wie das Überwachte schweigt genau dann, wenn es darauf ankommt.
# Vercel Cron in vercel.json ist nur die Rückfallebene (Hobby-Tarif erlaubt
# dort ohnehin nur einen Lauf pro Tag).
#
# WARUM DAS REPO ÖFFENTLICH IST: Für private Repos sind 2000 Actions-Minuten
# im Monat frei, und jeder Lauf wird auf eine volle Minute aufgerundet, obwohl
# er 5 bis 15 Sekunden dauert. Alle zehn Minuten wären 4320 Minuten - mehr als
# das Doppelte (bei den fünf Minuten von vorher war es das Vierfache). Ohne hinterlegte Zahlungsweise hätte GitHub die Actions dann bis
# zum Monatsende abgestellt, und die Statusseite wäre ab dem 7. stumm.
# Für öffentliche Repos sind Actions unbegrenzt frei. Deshalb liegt der Code
# offen; die Schlüssel liegen in GitHub Secrets und bei Vercel und sind davon
# unberührt (am 23.08. gegen die ganze Historie und die Protokolle geprüft).
#
# NUR NOCH RÜCKFALLEBENE, SEIT 24.08.2026: Der Takt unten ist eine Bitte,
# keine Zusage. Gemessen an 62 Messrunden der 24 Stunden davor lag der
# Abstand im Median bei 18,5 Minuten, im schlechtesten Fall bei 83,5 - nur
# 5 von 61 Abständen lagen unter 6 Minuten. GitHub reiht `schedule`-Läufe
# unter Last hinten an, nachts am stärksten.
#
# Das war nicht bloß ungenau, es rechnete falsch: `rollup_day` bucht pro
# Fehlmessung CHECK_INTERVAL_MINUTES an Ausfallzeit. Bei 5 eingetragenen
# und 18 tatsächlichen Minuten kam ein Ausfall nur zu gut einem Viertel in
# der Uptime an. Und "drei Fehlmessungen hintereinander" hieß dann nicht
# nach einer Viertelstunde, sondern im Median nach knapp einer Stunde.
#
# Den Takt hält jetzt ein externer Cron (siehe README, Abschnitt "Der Takt
# des Wächters"). Der liegt weiterhin außerhalb von Vercel - das war der
# Grund, den Wächter nicht dort laufen zu lassen, und der gilt unverändert.
# Dieser Workflow bleibt daneben stehen, damit der Wächter nicht an einem
# einzigen fremden Dienst hängt. Doppelte Messungen schaden nicht: jede ist
# eine echte Messung, und die Bewertung zählt Messungen, keine Uhrzeiten.
#
# ACHTUNG BEIM ÄNDERN: CHECK_INTERVAL_MINUTES muss zum Takt des externen
# Crons passen, nicht zu dem hier. Ein Test vergleicht beide.
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

jobs:
  messen:
    runs-on: ubuntu-latest
    steps:
      - name: Dienste prüfen
        run: |
          code=$(curl -sS -o /tmp/antwort.json -w '%{http_code}' \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            "${{ secrets.STATUS_URL }}/api/check")
          cat /tmp/antwort.json
          echo
          if [ "$code" != "200" ]; then
            echo "Wächter antwortete mit HTTP $code"
            exit 1
          fi
